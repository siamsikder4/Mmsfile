<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your bookmarked videos and creator packages stored locally in your browser." />
  <title>Saved Library — MediaHunt</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="favorites">
  <header id="site-header"></header>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="app-shell">
    <aside id="site-sidebar"></aside>
    <main class="main-content">
      
      <div class="toolbar-bar">
        <div>
          <div class="section-title-group">
            <div class="section-accent-bar"></div>
            <h1 class="section-title">♥ Saved Library</h1>
          </div>
          <p id="fav-page-count" class="section-subtitle">0 saved items</p>
        </div>
        <button type="button" id="clear-favs-btn" class="btn btn-secondary">Clear All Saved</button>
      </div>

      <div id="favorites-grid" class="media-grid"></div>
      <div id="favorites-pagination" class="pagination"></div>
    
    </main>
  </div>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
